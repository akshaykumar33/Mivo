services:
  - type: web
    name: mivo-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @mivo/database run build && pnpm --filter @mivo/server run build
    startCommand: node apps/server/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
