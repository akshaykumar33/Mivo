name: CI & Security Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.33.0'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Code Quality, Linting & Type Checking
  # ----------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mivo/database db:generate

      - name: Run Linters
        run: pnpm lint

      - name: Run Type Checking
        run: pnpm check:types

  # ----------------------------------------------------------------------------
  # Job 2: Security, Secret Scanning & SecOps Audit
  # ----------------------------------------------------------------------------
  security-and-secrets:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true

      - name: Run Mivo SecOps & License Compliance Audit
        run: node scripts/secops-scan.mjs

      - name: Audit Dependency Vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ----------------------------------------------------------------------------
  # Job 3: Vitest Unit & Integration Test Suite
  # ----------------------------------------------------------------------------
  test-unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mivo/database db:generate

      - name: Run Vitest Suites
        run: pnpm test:vitest

  # ----------------------------------------------------------------------------
  # Job 4: Monorepo Full Build
  # ----------------------------------------------------------------------------
  build:
    name: Monorepo Build
    needs: [lint-and-typecheck, test-unit-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @mivo/database db:generate

      - name: Build Monorepo (Turbo)
        run: pnpm build

  # ----------------------------------------------------------------------------
  # Job 5: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-verify:
    name: Dockerfile Build Verification
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Server Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mivo-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Web Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: mivo-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 6: Playwright End-to-End Suite
  # ----------------------------------------------------------------------------
  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password
          POSTGRES_DB: mivo_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mivo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: 'true'
      PORT: '4000'
      DATABASE_URL: 'postgresql://postgres:postgres_dev_password@localhost:5433/mivo_dev?schema=public'
      REDIS_URL: 'redis://localhost:6379'
      JWT_ACCESS_SECRET: 'ci_jwt_access_secret_super_secure_32chars_min'
      JWT_REFRESH_SECRET: 'ci_jwt_refresh_secret_super_secure_32chars_min'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '7d'
      CORS_ORIGIN: 'http://localhost:3000'
      PLAYWRIGHT_BASE_URL: 'http://localhost:3000'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Test Database Schema
        run: |
          pnpm --filter @mivo/database exec prisma generate
          pnpm --filter @mivo/database exec prisma db push --skip-generate

      - name: Build Packages & Applications
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e
        continue-on-error: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
