apiVersion: v1
kind: Secret
metadata:
  name: mivo-secrets
  namespace: mivo-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:REPLACE_WITH_PROD_DB_PASSWORD@postgres.mivo-prod.svc.cluster.local:5432/mivo_prod?schema=public"
  REDIS_URL: "redis://redis.mivo-prod.svc.cluster.local:6379"
  JWT_ACCESS_SECRET: "REPLACE_WITH_MINIMUM_32_CHARACTERS_PRODUCTION_JWT_ACCESS_KEY"
  JWT_REFRESH_SECRET: "REPLACE_WITH_MINIMUM_32_CHARACTERS_PRODUCTION_JWT_REFRESH_KEY"
  S3_ENDPOINT: "http://minio.mivo-prod.svc.cluster.local:9000"
  S3_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY"
  S3_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"

