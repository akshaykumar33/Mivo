apiVersion: v1
kind: ConfigMap
metadata:
  name: mivo-config
  namespace: mivo-prod
data:
  NODE_ENV: "production"
  PORT: "4000"
  WEB_PORT: "3000"
  CORS_ORIGIN: "https://mivo.live"
  NEXT_PUBLIC_API_URL: "https://mivo.live/api"
  NEXT_PUBLIC_WS_URL: "https://mivo.live"
  S3_BUCKET_NAME: "mivo-media"
  S3_REGION: "us-east-1"

