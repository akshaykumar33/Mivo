# ==============================================================================
# Production Docker Compose Architecture for Mivo Platform
# Orchestrates: Database (Postgres 16), Cache (Redis 7), Storage (MinIO),
# Backend Server (NestJS), Frontend (Next.js 15 Standalone), and Nginx Reverse Proxy
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: mivo-postgres-prod
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-mivo_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mivo_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mivo-network

  redis:
    image: redis:7-alpine
    container_name: mivo-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mivo-network

  minio:
    image: minio/minio:latest
    container_name: mivo-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - mivo-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mivo-server-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_prod_password}@postgres:5432/${POSTGRES_DB:-mivo_prod}?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_access_super_secret_production_key_32c}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_super_secret_production_key_32c}
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: "mivo-media"
      S3_REGION: "us-east-1"
    ports:
      - "4000:4000"
    networks:
      - mivo-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mivo-web-prod
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost}
    ports:
      - "3000:3000"
    networks:
      - mivo-network

  nginx:
    image: nginx:1.25-alpine
    container_name: mivo-nginx-proxy
    restart: unless-stopped
    depends_on:
      - server
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mivo-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  mivo-network:
    driver: bridge

